# Runs every test on Linux and Windows with Python 3.14 and the newest release, for each
# push to main and each pull request
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The token can only read the code
permissions:
  contents: read

jobs:
  test:
    strategy:
      # One run failing doesn't cancel the others, so every result is seen
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The oldest version the tool accepts, and the newest release, so a new one is tested
        # on the first push after it comes out
        python: ["3.14", "3.x"]
    runs-on: ${{ matrix.os }}
    # A regression that makes a test run for minutes stops here, not after GitHub's six hours
    timeout-minutes: 20
    env:
      # Shared runners are slower and busier than a desktop
      TIMING_SCALE: 3
    steps:
      # Pinned to the commit, since a tag can be moved to other code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Keeps the token out of .git/config, where any later step could read it
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          # Otherwise 3.x is the newest version already on the runner, which can trail a release
          check-latest: true
      - run: python -m pip install -r requirements-dev.txt
      # The timing tests run on their own, since measuring coverage slows the code down
      - run: python -m coverage run -m pytest --ignore=tests/test_timing.py
      - run: python -m coverage combine
      - run: python -m coverage report
      - run: python -m pytest tests/test_timing.py
      - run: python -m pytest -m slow
