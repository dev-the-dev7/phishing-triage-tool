[pytest]
testpaths = tests
# Lets the tests import triage without installing it
pythonpath = .
# Turns mistakes into errors instead of warnings: a typo in a mark or a setting here, the
# same test case listed twice, and a test marked xfail that starts passing, so a fixed
# limitation gets its mark and README line removed
strict = true
# The timing sweep and the long damaged-email run take a minute or two, so they only run
# when asked for: pytest -m slow
markers =
    slow: timing sweep and long damaged-email run
addopts = -m "not slow"
